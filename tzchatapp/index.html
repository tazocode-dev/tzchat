<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>손끝</title>

    <!-- SPA는 루트 기준 로드 (Vite base:'/'와 일치) -->
    <base href="/" />

    <meta name="color-scheme" content="light" />

    <!-- ✅ 모바일/WebView 안전 뷰포트 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />

    <!-- 전화번호 자동 링크 방지(디자인 깨짐 방지) -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <meta name="theme-color" content="#f7f5f2" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS PWA 기본 설정 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="손끝" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- ✅ index.html 자체 캐시 최소화(서버 헤더가 최우선이지만 보조 차단용) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Vue/Ionic 마운트 전에도 앱의 밝은 테마를 유지한다. -->
    <style>
      /*
        초기 렌더(아직 Vue/Ionic가 마운트되기 전)에서도
        배경이 서비스의 밝은 배경과 다르게 번쩍이지 않도록 고정.
        App.vue의 theme-gold 및 theme CSS 로드 후에는 해당 토큰이 덮어씁니다.
      */
      html,
      body {
        color: #24211f;
        background-color: #f7f5f2;
        overscroll-behavior: none;
        margin: 0;
        height: 100%;
        min-height: 100dvh;
        -webkit-text-size-adjust: 100%;
      }
      /* 데스크톱 보조용 스크롤바 */
      * {
        scrollbar-width: thin;
        scrollbar-color: #bbb transparent;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: #bbb;
        border-radius: 4px;
      }
    </style>

    <!-- ✅ 빌드/배포 버전 태그(로그 분석/버전 식별용) -->
    <meta name="app-version" content="1.0.47" />
  </head>

  <body>
    <noscript>이 앱을 사용하려면 JavaScript가 필요합니다.</noscript>

    <div id="app"></div>

    <!-- 개발 모드에서는 /src/main.ts, 빌드 후에는 Vite가 dist/index.html에 해시된 자산을 주입 -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
