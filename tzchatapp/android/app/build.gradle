// ------------------------------------------------------------
// app/build.gradle  (릴리스 서명 설정)
// - 기존 내용 최대한 유지
// - keystore.properties 읽어서 release 서명 적용
// - google-services.json 존재 시 플러그인 자동 적용 (로그로 확인 가능)
// -----------------------------------------------------------

apply plugin: 'com.android.application'

// [ADD] 안전용 import (일부 환경에서 필요)
import java.util.Properties
import java.io.FileInputStream
import java.util.Locale

// [ADD] keystore.properties 로드 (Git에 올리지 않는 비밀 파일)
// 권장 경로: android/keystore/keystore.properties
// 예시 내용:
//   storeFile=keystore/tzchat-release.keystore
//   storePassword=비밀번호
//   keyAlias=tzchat
//   keyPassword=비밀번호
def keystorePropertiesFile = rootProject.file("keystore/keystore.properties")
def keystoreProperties = new Properties()
def releaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase(Locale.ROOT).contains("release")
}
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def requiredSigningProperties = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
if (releaseTaskRequested) {
    if (!keystorePropertiesFile.exists()) {
        throw new GradleException("Release signing configuration is missing: keystore.properties is required.")
    }

    def missingSigningProperties = requiredSigningProperties.findAll { propertyName ->
        !keystoreProperties.getProperty(propertyName)?.trim()
    }
    if (!missingSigningProperties.isEmpty()) {
        throw new GradleException(
            "Release signing configuration is incomplete: ${missingSigningProperties.join(', ')} must be set."
        )
    }

    def releaseKeystoreFile = rootProject.file(keystoreProperties.getProperty('storeFile').trim())
    if (!releaseKeystoreFile.isFile()) {
        throw new GradleException("Release signing configuration is invalid: the configured keystore file does not exist.")
    }
}

def hasCompleteSigningConfiguration = requiredSigningProperties.every { propertyName ->
    keystoreProperties.getProperty(propertyName)?.trim()
}
def configuredKeystoreFile = hasCompleteSigningConfiguration
    ? rootProject.file(keystoreProperties.getProperty('storeFile').trim())
    : null

android {
    namespace "com.tazocode.tzchat"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.tazocode.tzchat"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        // ✅ 스토어 업로드 핵심: 업로드할 때마다 versionCode는 1,2,3… 증가
        versionCode 47
        versionName "1.0.47"

        aaptOptions {
            // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // [ADD] 릴리스 서명 정보
    signingConfigs {
        release {
            if (configuredKeystoreFile?.isFile()) {
                storeFile configuredKeystoreFile
                storePassword keystoreProperties.getProperty('storePassword').trim()
                keyAlias keystoreProperties.getProperty('keyAlias').trim()
                keyPassword keystoreProperties.getProperty('keyPassword').trim()
                if (releaseTaskRequested) {
                    logger.lifecycle("✅ release signingConfig 검증 및 적용 완료")
                }
            }
        }
    }

    buildTypes {
        release {
            // ✅ 난독화/리소스 축소 활성화 → mapping.txt 생성
            minifyEnabled true
            shrinkResources true

            // ✅ 최적화된 기본 규칙 + 사용자 규칙 파일 적용
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'

            // ✅ 릴리스 빌드에 서명 적용
            signingConfig signingConfigs.release
        }

        // debug 빌드는 기본값 유지 (난독화/축소 비활성)
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    // FCM은 @capacitor/push-notifications 플러그인이 제공한다.
    // 앱 모듈에서 Firebase BoM/Analytics/Messaging을 다시 선언하지 않는다.
}

apply from: 'capacitor.build.gradle'

// google-services 플러그인: google-services.json 존재 시 자동 적용
try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        logger.lifecycle("✅ google-services 플러그인 적용")
    }
} catch (Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
